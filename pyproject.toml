[project]
name = "project-4"
version = "0.1.0"
description = ""
authors = [
    {name = "Evgenii_Lobachev",email = "lobachev9614@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.lint.dependencies]
isort = "^7.0.0"
flake8 = "^7.3.0"
black = "^26.1.0"
mypy = "^1.19.1"



[tool.poetry.group.dev.dependencies]
django = "^6.0.2"
django-stubs = "^5.2.9"
psycopg2 = "^2.9.11"
ipython = "^9.10.0"
python-dotenv = "^1.2.1"
pillow = "^12.1.1"
crispy-bootstrap5 = "^2025.6"
django-crispy-forms = "^2.5"
django-cleanup = "^9.0.0"
django-countries = "^8.2.0"
django-phonenumber-field = "^8.4.0"
phonenumbers = "^9.0.25"
redis = "^7.3.0"

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = ['.venv','tests', 'idea', 'git', '.coverage', 'logs', 'static']

[tool.isort]
profile = "black"
line_length = 119

[tool.black]
line-length = 119
exclude = '''
(
  /(
      \.git
      \.idea
      \.venv
      \.coverage
      \.static
  )/
)
'''
