<header class="sticky-top" style="background: #8a2be2; color: white;">
    <div class="p-0 px-md-0 mb-0 border-bottom">
        <nav class="navbar navbar-expand-lg">
          <div class="container-fluid">
              <h5 class="me-5 my-0 mr-md-auto font-weight-normal">Online store</h5>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
              <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                  <a class="me-2 p-2 btn btn-warning" href="{% url 'catalog:catalog' %}">Каталог</a>
                </li>
                <li class="nav-item">
                  <li class="nav-item dropdown">
                    <a class="me-2 p-2 btn btn-warning dropdown-toggle" data-bs-toggle="dropdown" href="#" role="button" aria-expanded="false">Категории</a>
                    <ul class="dropdown-menu">
                      {% for category in categories %}
                        <li><a class="dropdown-item" href="{% url 'catalog:product_category' category.pk %}">{{ category.name }}</a></li>
                        <li><hr class="dropdown-divider"></li>
                      {% endfor %}
                    </ul>
                  </li>
                </li>
                <li class="nav-item">
                  <a class="me-2 p-2 btn btn-warning" href="{% url 'catalog:contacts' %}">Контакты</a>
                </li>
                <li class="nav-item">
                  <a class="me-2 p-2 btn btn-warning" href="{% url 'catalog:add_product' %}">Добавить продукт</a>
                </li>
                <li class="nav-item">
                  <a class="me-2 p-2 btn btn-warning" href="{% url 'blogs:blogs' %}">Блог магазина</a>
                </li>
              </ul>
              <form class="d-flex" role="search">
                <input class="form-control me-2" type="search" placeholder="Поиск" aria-label="Search"/>
                <button class="btn btn-light" type="submit">Найти</button>
              </form>
            </div>
          </div>
        </nav>
    </div>
</header>
